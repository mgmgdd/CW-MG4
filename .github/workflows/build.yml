name: Build Release APK
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Strip CN mirror repositories for CI
        run: |
          sed -i -E '/maven\("https:\/\/(maven\.aliyun\.com|repo\.huaweicloud\.com)/d' settings.gradle.kts
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode signing keystore from Secrets
        run: |
          set +x
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          ls -la keystore.jks
      - name: Build release APK (signed with release keystore)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set +x
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Clean up signing keystore
        run: |
          rm -f keystore.jks
          echo '临时 keystore 已清理'
      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CW-MG4-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CW-MG4 ${{ github.ref_name }}
          body: |
            CW-MG4 自动构建版（GitHub Actions 云构建）
            - 版本：${{ github.ref_name }}
            - 签名：release keystore
            - 构建：`./gradlew :app:assembleRelease`（R8 混淆 + 资源压缩）
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
